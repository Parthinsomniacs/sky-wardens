<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161c"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg1)"/>
  <!-- Radar rings -->
  <g stroke="#105784" stroke-opacity="0.28" fill="none">
    <circle cx="150" cy="150" r="40"/>
    <circle cx="150" cy="150" r="80"/>
    <circle cx="150" cy="150" r="120"/>
  </g>
  <!-- Crosshair -->
  <g stroke="#105784" stroke-opacity="0.5" stroke-width="1">
    <line x1="20" y1="150" x2="280" y2="150"/>
    <line x1="150" y1="20" x2="150" y2="280"/>
  </g>
  <!-- Radar sweep -->
  <path d="M150 150 L150 30 A120 120 0 0 1 254 210 Z" fill="#4dd9ff" fill-opacity="0.14"/>
  <!-- Blips -->
  <circle cx="198" cy="96" r="4" fill="#105784"/>
  <circle cx="106" cy="182" r="3" fill="#4dd9ff"/>
  <circle cx="176" cy="214" r="2.5" fill="#105784" fill-opacity="0.8"/>
</svg>
