<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1319"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg2)"/>
  <!-- Quadcopter drone silhouette -->
  <g stroke="#105784" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- arms -->
    <line x1="150" y1="150" x2="86" y2="96"/>
    <line x1="150" y1="150" x2="214" y2="96"/>
    <line x1="150" y1="150" x2="86" y2="204"/>
    <line x1="150" y1="150" x2="214" y2="204"/>
    <!-- rotors -->
    <ellipse cx="86" cy="96" rx="30" ry="9"/>
    <ellipse cx="214" cy="96" rx="30" ry="9"/>
    <ellipse cx="86" cy="204" rx="30" ry="9"/>
    <ellipse cx="214" cy="204" rx="30" ry="9"/>
    <!-- body -->
    <rect x="132" y="132" width="36" height="36" rx="8" fill="#4dd9ff" fill-opacity="0.15"/>
  </g>
  <!-- sensor dot -->
  <circle cx="150" cy="168" r="4" fill="#105784"/>
</svg>
